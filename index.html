<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Spaans overhoren</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Playfair+Display:wght@600;700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Libre+Baskerville:wght@400;700&family=Special+Elite&family=Poppins:wght@500;600;700&family=Inter:wght@400;500;600;700&family=Baloo+2:wght@500;600;700&display=swap');

  :root{
    --paper: #f1eee7;
    --card: #fffdf8;
    --rule: #d8cdb8;
    --margin-red: #c60b1e;
    --ink: #241d16;
    --ink-soft: #6b5f4f;
    --correct: #2f7d4f;
    --correct-bg: #eaf5ee;
    --wrong: #c60b1e;
    --wrong-bg: #fbecec;
    --accent: #c60b1e;
    --gold: #c9962b;
    --font-head: 'Playfair Display', serif;
    --font-body: 'Source Serif 4', Georgia, serif;
    --gap: 20px;
  }

  *{ box-sizing: border-box; }

  body{
    margin:0;
    min-height:100vh;
    background:
      radial-gradient(ellipse at 50% -10%, rgba(198,11,30,0.05), transparent 55%),
      var(--paper);
    background-image:
      radial-gradient(ellipse at 50% -10%, rgba(198,11,30,0.05), transparent 55%),
      repeating-linear-gradient(
        var(--paper) 0px, var(--paper) 37px,
        var(--rule) 38px
      );
    font-family: var(--font-body);
    color: var(--ink);
    display:flex;
    justify-content:center;
    padding: 44px 20px 60px;
    transition: background 0.3s ease;
  }

  .sheet{ width:100%; max-width: 660px; }

  header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom: 6px;
    padding-bottom: 14px;
    border-bottom: 3px solid var(--accent);
  }

  .flag-bar{
    height: 4px;
    border-radius: 2px;
    margin-bottom: 30px;
    background: linear-gradient(90deg,
      var(--accent) 0%, var(--accent) 22%,
      var(--gold) 22%, var(--gold) 78%,
      var(--accent) 78%, var(--accent) 100%);
    opacity: 0.85;
  }

  .brand{ display:flex; align-items:center; gap: 14px; }
  .seal{
    width: 40px; height: 40px;
    border-radius: 50%;
    background: var(--card);
    border: 1.5px solid var(--gold);
    box-shadow: 0 0 0 3px rgba(201,150,43,0.12), 0 2px 6px rgba(36,29,22,0.12);
    display:flex; align-items:center; justify-content:center;
    font-family: 'Playfair Display', serif;
    font-size: 0.72rem;
    font-weight: 700;
    color: var(--gold);
    letter-spacing: 0.5px;
    flex-shrink:0;
  }

  h1{
    font-family: var(--font-head);
    font-size: 1.5rem;
    font-weight: 700;
    margin:0;
    letter-spacing: 0.2px;
  }

  .header-right{ display:flex; align-items:center; gap: 14px; }
  #progress{
    font-size: 0.92rem;
    color: var(--ink-soft);
    font-variant-numeric: tabular-nums;
  }

  #topMenuBtn, #rulesBtnTop{
    display:none;
    font-size: 0.85rem;
    padding: 7px 14px;
  }

  .rules-panel{
    margin-top: 14px;
    padding: 18px 20px;
    background: #fbf7ee;
    border: 1px solid var(--rule);
    border-left: 3px solid var(--gold);
    border-radius: 4px;
  }
  .rules-panel h4{
    margin: 0 0 4px 0;
    font-family: var(--font-head);
    font-size: 1.05rem;
  }
  .rules-panel .rules-sub{ font-size: 0.82rem; color: var(--ink-soft); margin-bottom: 14px; }
  .rules-table{ width:100%; border-collapse: collapse; font-size: 0.94rem; }
  .rules-table th{
    text-align:left;
    font-size: 0.72rem;
    text-transform: uppercase;
    letter-spacing: 0.6px;
    color: var(--gold);
    padding: 4px 8px 6px 0;
    border-bottom: 1px solid var(--rule);
  }
  .rules-table td{
    padding: 5px 8px 5px 0;
    border-bottom: 1px solid #ece5d5;
  }
  .rules-table td.ending{ color: var(--accent); font-weight: 600; }
  .rules-table tr:last-child td{ border-bottom:none; }

  .card{
    position:relative;
    background: var(--card);
    border: 1px solid #e4ddc9;
    border-left: 5px solid var(--margin-red);
    border-radius: 6px;
    padding: 42px 34px 34px 44px;
    box-shadow:
      0 1px 1px rgba(20,10,10,0.04),
      0 8px 20px rgba(36,29,22,0.08),
      0 20px 44px rgba(36,29,22,0.06);
    opacity: 0;
    transform: translateY(6px);
    animation: cardIn 0.32s ease forwards;
  }
  @keyframes cardIn{
    to{ opacity:1; transform: translateY(0); }
  }

  /* ---------- MENU ---------- */
  .menu-card{ min-height:auto; }
  .menu-section{ margin-bottom: 26px; }
  .menu-section:last-of-type{ margin-bottom: 8px; }
  .menu-label{
    font-size: 0.78rem;
    text-transform: uppercase;
    letter-spacing: 0.9px;
    color: var(--gold);
    font-weight: 600;
    margin-bottom: 12px;
    font-family: var(--font-body);
  }
  .option-list{ display:flex; flex-direction:column; gap: 8px; }
  .option-list.grid2{ display:grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .option-list.grid3{ display:grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; }

  .option-row{
    display:flex;
    align-items:flex-start;
    gap: 12px;
    padding: 12px 14px;
    border: 1px solid #e2e6ee;
    border-radius: 5px;
    cursor:pointer;
    transition: border-color 0.15s ease, background 0.15s ease, box-shadow 0.15s ease, transform 0.15s ease;
  }
  .option-row:hover{ border-color: var(--accent); }
  .option-row.selected{
    border-color: var(--accent);
    background: #fbf1f0;
    box-shadow: inset 3px 0 0 var(--gold), 0 2px 8px rgba(36,29,22,0.06);
    transform: translateY(-1px);
  }
  .option-row input{ margin-top: 3px; accent-color: var(--accent); flex-shrink:0; }
  .option-row .opt-title{ font-weight:600; }
  .option-row .opt-desc{ font-size: 0.83rem; color: var(--ink-soft); margin-top: 3px; }

  .start-btn{
    width:100%;
    padding: 15px 18px;
    font-size: 1.08rem;
    margin-top: 8px;
    letter-spacing: 0.2px;
  }

  /* ---------- QUIZ ---------- */
  .prompt-wrap{ min-height: 220px; display:flex; flex-direction:column; justify-content:center; }
  .prompt-lang{
    font-size: 0.76rem;
    text-transform: uppercase;
    letter-spacing: 0.8px;
    color: var(--gold);
    font-weight: 600;
    display:block;
    margin-bottom: 12px;
  }
  .es-word{
    font-family: var(--font-head);
    font-size: 2.15rem;
    font-weight: 700;
    line-height:1.3;
    margin: 0 0 26px 0;
  }

  form{ display:flex; flex-direction:column; gap: 6px; }
  label{ font-size: 0.85rem; color: var(--ink-soft); }

  input[type="text"]{
    font-family: var(--font-body);
    font-size: 1.3rem;
    padding: 9px 4px;
    border: none;
    border-bottom: 2px solid var(--ink);
    background: transparent;
    color: var(--ink);
    outline: none;
    transition: border-color 0.15s ease;
  }
  input[type="text"]:focus{ border-bottom-color: var(--accent); }
  input[type="text"]:disabled{ color: var(--ink-soft); }

  .actions{ display:flex; gap: 10px; margin-top: 20px; flex-wrap: wrap; }

  button{
    font-family: var(--font-body);
    font-size: 0.96rem;
    padding: 10px 20px;
    border-radius: 5px;
    border: 1px solid var(--accent);
    background: linear-gradient(180deg, #d21128 0%, var(--accent) 100%);
    color: var(--card);
    cursor:pointer;
    transition: transform 0.1s ease, box-shadow 0.15s ease, opacity 0.15s ease, background 0.15s ease;
    box-shadow: 0 1px 2px rgba(20,10,10,0.18);
  }
  button:hover:not(:disabled){ transform: translateY(-1px); box-shadow: 0 4px 10px rgba(198,11,30,0.28); background: linear-gradient(180deg, #b90f22 0%, #a80a19 100%); }
  button:active:not(:disabled){ transform: translateY(0); }
  button.secondary{ background: transparent; color: var(--ink); border-color: var(--ink); box-shadow:none; }
  button.secondary:hover:not(:disabled){ background: transparent; box-shadow: 0 4px 10px rgba(20,10,10,0.12); }
  button:disabled{ opacity:0.35; cursor:default; transform:none; box-shadow:none; }

  .mark{
    position:absolute;
    top: 18px;
    right: 24px;
    font-family: 'Caveat', cursive;
    font-size: 3rem;
    font-weight: 700;
    transform: rotate(-6deg);
    opacity: 0;
    transition: opacity 0.15s ease;
  }
  .mark.show{ opacity:1; }
  .mark.correct{ color: var(--correct); }
  .mark.wrong{ color: var(--wrong); }

  .feedback{
    margin-top: 16px;
    font-family: 'Caveat', cursive;
    font-size: 1.4rem;
    min-height: 1.6em;
  }
  .feedback.correct{ color: var(--correct); }
  .feedback.wrong{ color: var(--wrong); }

  .mc-options{ display:flex; flex-direction:column; gap: 10px; }
  .mc-option{
    text-align:left;
    background: var(--card);
    color: var(--ink);
    border: 1px solid #d7dce6;
    padding: 14px 16px;
    font-size: 1.1rem;
    border-radius: 4px;
    box-shadow: none;
  }
  .mc-option:hover:not(:disabled){ border-color: var(--accent); }
  .mc-option.correct{ border-color: var(--correct); background: var(--correct-bg); color: var(--correct); }
  .mc-option.wrong{ border-color: var(--wrong); background: var(--wrong-bg); color: var(--wrong); }
  .mc-option:disabled{ cursor:default; }

  .grade-actions button{ flex: 1; padding: 16px 12px; font-size: 1.05rem; }
  #revealBtn{ font-size: 1.05rem; padding: 15px 18px; }

  .stats{ display:flex; gap: 22px; margin-top: 22px; font-size: 0.85rem; color: var(--ink-soft); }
  .stats b{ color: var(--ink); }

  .result{ text-align:center; }
  .result .score{
    font-family: 'Caveat', cursive;
    font-size: 4.5rem;
    color: var(--accent);
    line-height:1;
    margin: 6px 0 4px 0;
  }
  .result p{ color: var(--ink-soft); margin: 4px 0 26px 0; }

  .mistake-list{ text-align:left; border-top: 1px dashed var(--rule); padding-top: 18px; margin-top: 6px; }
  .mistake-list h3{ font-size: 1rem; margin: 0 0 10px 0; color: var(--ink); }
  .mistake-list ul{ list-style:none; padding:0; margin:0; }
  .mistake-list li{
    display:flex; justify-content:space-between; gap: 14px;
    padding: 7px 0; border-bottom: 1px solid #eee; font-size: 0.98rem;
  }
  .mistake-list .es{ font-weight:600; }
  .mistake-list .nl{ color: var(--ink-soft); }

  .result-actions{ display:flex; flex-wrap:wrap; gap:10px; justify-content:center; margin-top: 24px; }

  footer{ text-align:center; margin-top: 22px; font-size: 0.8rem; color: var(--ink-soft); }

  .hidden{ display:none !important; }

  /* ---------- THEMES ---------- */
  body[data-theme="rojo"]{ --paper:#f1eee7; --card:#fffdf8; --rule:#d8cdb8; --ink:#241d16; --ink-soft:#6b5f4f; --accent:#c60b1e; --gold:#c9962b; --font-head:'Playfair Display',serif; --font-body:'Source Serif 4',Georgia,serif; }
  body[data-theme="sevilla"]{ --paper:#f6ede0; --card:#fffaf2; --rule:#e3cba8; --ink:#3a2415; --ink-soft:#7a5c3e; --accent:#d1590f; --gold:#c98a1c; --font-head:'Fraunces',serif; --font-body:'Source Serif 4',Georgia,serif; }
  body[data-theme="flamenco"]{ --paper:#f3e9ea; --card:#fffbfb; --rule:#e0c3c7; --ink:#2b1420; --ink-soft:#6e4a56; --accent:#a3134f; --gold:#c9962b; --font-head:'Playfair Display',serif; --font-body:'Source Serif 4',Georgia,serif; }
  body[data-theme="azulejo"]{ --paper:#eaf0f3; --card:#ffffff; --rule:#c8d8de; --ink:#132a36; --ink-soft:#4d6774; --accent:#0f5c8c; --gold:#e0a933; --font-head:'Libre Baskerville',serif; --font-body:'Source Serif 4',Georgia,serif; }
  body[data-theme="oliva"]{ --paper:#eef0e4; --card:#fbfcf6; --rule:#d3d8bf; --ink:#2b2f1c; --ink-soft:#5e6449; --accent:#5c6d2e; --gold:#b98a1e; --font-head:'Fraunces',serif; --font-body:'Source Serif 4',Georgia,serif; }
  body[data-theme="noche"]{ --paper:#171310; --card:#211b16; --rule:#3a322a; --ink:#f2e9dc; --ink-soft:#b8ab97; --accent:#e2394a; --gold:#e0b24a; --font-head:'Playfair Display',serif; --font-body:'Source Serif 4',Georgia,serif; }
  body[data-theme="vintage"]{ --paper:#ece2cf; --card:#f8f1e2; --rule:#cdbd98; --ink:#3c2f1e; --ink-soft:#7a6a4a; --accent:#a3401f; --gold:#8c6a2e; --font-head:'Special Elite',cursive; --font-body:Georgia,serif; }
  body[data-theme="menta"]{ --paper:#eaf4f0; --card:#ffffff; --rule:#c6e2d7; --ink:#123028; --ink-soft:#4c7266; --accent:#e0672f; --gold:#0f8f77; --font-head:'Poppins',sans-serif; --font-body:'Inter',sans-serif; }
  body[data-theme="mono"]{ --paper:#f2f2f0; --card:#ffffff; --rule:#dcdcd8; --ink:#191919; --ink-soft:#5c5c5c; --accent:#1a1a1a; --gold:#8a8a8a; --font-head:'Inter',sans-serif; --font-body:'Inter',sans-serif; }
  body[data-theme="fiesta"]{ --paper:#fdf1e6; --card:#fffaf3; --rule:#f6d9b8; --ink:#3a1f0e; --ink-soft:#8a5a2e; --accent:#e8442f; --gold:#f0a400; --font-head:'Baloo 2',cursive; --font-body:'Poppins',sans-serif; }

  /* ---------- APP SHELL: nav / home / settings / theme screens ---------- */
  .nav-icon{
    font-size: 0.85rem;
    padding: 7px 14px;
  }

  .home-card{ text-align:center; }
  .home-summary{ margin-bottom: 26px; }
  .summary-label{
    display:block;
    font-size: 0.76rem;
    text-transform: uppercase;
    letter-spacing: 0.8px;
    color: var(--gold);
    font-weight: 600;
    margin-bottom: 8px;
  }
  .summary-text{ font-size: 1.05rem; color: var(--ink-soft); }

  .big-start{
    width: 100%;
    padding: 30px 20px;
    font-family: var(--font-head);
    font-size: 1.6rem;
    font-weight: 700;
    border-radius: 10px;
    letter-spacing: 0.3px;
    box-shadow: 0 10px 24px rgba(198,11,30,0.22);
  }
  .big-start:hover:not(:disabled){ box-shadow: 0 14px 30px rgba(198,11,30,0.3); }

  .home-quick{ display:flex; gap: 10px; margin-top: 18px; }
  .home-quick button{ flex:1; }

  .theme-grid{ display:grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .theme-card{
    border: 1px solid #e2e6ee;
    border-radius: 6px;
    padding: 14px;
    cursor:pointer;
    text-align:left;
    transition: border-color 0.15s ease, transform 0.15s ease;
    background: var(--card);
  }
  .theme-card:hover{ border-color: var(--accent); transform: translateY(-1px); }
  .theme-card.selected{ border-color: var(--accent); box-shadow: inset 3px 0 0 var(--gold); }
  .swatch-row{ display:flex; gap: 6px; margin-bottom: 10px; }
  .swatch{ width: 18px; height: 18px; border-radius: 50%; border: 1px solid rgba(0,0,0,0.08); }
  .theme-name{ font-weight: 600; font-size: 0.95rem; }
  .theme-font{ font-size: 0.78rem; color: var(--ink-soft); margin-top: 2px; }
  .back-row{ margin-top: 20px; }

  /* ---------- PHONE / TELEFOON WEERGAVE ---------- */
  body.phone-mode .sheet{ max-width: 480px; }
  body.phone-mode .card{ padding: 30px 20px 26px 26px; }
  body.phone-mode .es-word{ font-size: 1.7rem; }
  body.phone-mode input[type="text"]{ font-size: 1.4rem; padding: 12px 4px; }
  body.phone-mode .actions{ flex-direction:column; }
  body.phone-mode .actions button{ width:100%; padding: 15px 18px; font-size: 1.05rem; }
  body.phone-mode .mc-option{ padding: 16px 16px; font-size: 1.05rem; }
  body.phone-mode .option-list.grid2,
  body.phone-mode .option-list.grid3{ grid-template-columns: 1fr; }
  body.phone-mode .theme-grid{ grid-template-columns: 1fr; }
  body.phone-mode h1{ font-size: 1.25rem; }
  body.phone-mode .seal{ width:34px; height:34px; font-size:0.65rem; }
  body.phone-mode .result-actions{ flex-direction:column; }
  body.phone-mode .result-actions button{ width:100%; }
  body.phone-mode footer{ font-size: 0.75rem; }

  @media (max-width: 480px){
    body{ padding: 28px 12px 40px; }
    .card{ padding: 28px 18px 24px 24px; }
    .es-word{ font-size: 1.6rem; }
  }
</style>
</head>
<body>
<div class="sheet">
  <header>
    <div class="brand">
      <div class="seal">SP·NL</div>
      <h1>Spaans overhoren</h1>
    </div>
    <div class="header-right">
      <div id="progress"></div>
      <button type="button" id="rulesBtnTop" class="secondary nav-icon" style="display:none;">Regels</button>
      <button type="button" id="navSettings" class="secondary nav-icon">&#9881; Instellingen</button>
      <button type="button" id="navTheme" class="secondary nav-icon">&#127912; Thema</button>
      <button type="button" id="topMenuBtn" class="secondary nav-icon">&larr; Terug</button>
    </div>
  </header>
  <div class="flag-bar"></div>

  <!-- HOME -->
  <div class="card home-card" id="homeCard">
    <div class="home-summary">
      <span class="summary-label">Huidige instelling</span>
      <div class="summary-text" id="summaryText">Typen · Gemixt · Basiswoorden · Groot</div>
    </div>
    <button type="button" class="big-start" id="bigStartBtn">&#9654; Start oefenen</button>
    <div class="home-quick">
      <button type="button" id="quickSettingsBtn" class="secondary">&#9881; Instellingen</button>
      <button type="button" id="quickThemeBtn" class="secondary">&#127912; Thema</button>
    </div>
  </div>

  <!-- MENU -->
  <div class="card menu-card" id="menuCard" style="display:none;">
    <div class="menu-label" style="margin-bottom:16px; font-size:0.95rem; letter-spacing:0.2px; text-transform:none; color:var(--ink);">Instellingen</div>
    <div class="menu-section">
      <div class="menu-label">Oefentype</div>
      <div class="option-list grid3" id="exerciseList">
        <label class="option-row selected" data-value="type">
          <input type="radio" name="exercise" value="type" checked>
          <div><div class="opt-title">Typen</div><div class="opt-desc">Zelf intikken</div></div>
        </label>
        <label class="option-row" data-value="flash">
          <input type="radio" name="exercise" value="flash">
          <div><div class="opt-title">Flashcards</div><div class="opt-desc">Tikken, zelf beoordelen</div></div>
        </label>
        <label class="option-row" data-value="mc">
          <input type="radio" name="exercise" value="mc">
          <div><div class="opt-title">Meerkeuze</div><div class="opt-desc">4 opties</div></div>
        </label>
      </div>
    </div>

    <div class="menu-section">
      <div class="menu-label">Richting</div>
      <div class="option-list grid3" id="directionList">
        <label class="option-row" data-value="sp-nl">
          <input type="radio" name="direction" value="sp-nl">
          <div><div class="opt-title">SP &rarr; NL</div></div>
        </label>
        <label class="option-row" data-value="nl-sp">
          <input type="radio" name="direction" value="nl-sp">
          <div><div class="opt-title">NL &rarr; SP</div></div>
        </label>
        <label class="option-row selected" data-value="mixed">
          <input type="radio" name="direction" value="mixed" checked>
          <div><div class="opt-title">Gemixt</div></div>
        </label>
      </div>
    </div>

    <div class="menu-section">
      <div class="menu-label">Woorden</div>
      <div class="option-list grid2" id="setList">
        <label class="option-row" data-value="everything">
          <input type="radio" name="wset" value="everything">
          <div><div class="opt-title">Alles bij elkaar (113)</div><div class="opt-desc">Alle thema's + zinnen samen</div></div>
        </label>
        <label class="option-row selected" data-value="all">
          <input type="radio" name="wset" value="all" checked>
          <div><div class="opt-title">Basiswoorden (49)</div><div class="opt-desc">Woordjes deel 1 + 2</div></div>
        </label>
        <label class="option-row" data-value="part1">
          <input type="radio" name="wset" value="part1">
          <div><div class="opt-title">Deel 1 (32)</div><div class="opt-desc">School</div></div>
        </label>
        <label class="option-row" data-value="part2">
          <input type="radio" name="wset" value="part2">
          <div><div class="opt-title">Deel 2 (17)</div><div class="opt-desc">Eten &amp; tijd</div></div>
        </label>
        <label class="option-row" data-value="numbers">
          <input type="radio" name="wset" value="numbers">
          <div><div class="opt-title">Getallen 1-100</div><div class="opt-desc">Cijfer &rarr; Spaans</div></div>
        </label>
        <label class="option-row" data-value="verbs">
          <input type="radio" name="wset" value="verbs">
          <div><div class="opt-title">Werkwoorden</div><div class="opt-desc">hablar / comer / vivir, presente</div></div>
        </label>
        <label class="option-row" data-value="days">
          <input type="radio" name="wset" value="days">
          <div><div class="opt-title">Dagen van de week (7)</div></div>
        </label>

// ---- Getallen 1-100 (part 3) ----
function buildNumbers(){
  const ones = ['','uno','dos','tres','cuatro','cinco','seis','siete','ocho','nueve'];
  const teens = ['diez','once','doce','trece','catorce','quince','dieciséis','diecisiete','dieciocho','diecinueve'];
  const twenties = ['veinte','veintiuno','veintidós','veintitrés','veinticuatro','veinticinco','veintiséis','veintisiete','veintiocho','veintinueve'];
  const tens = {3:'treinta',4:'cuarenta',5:'cincuenta',6:'sesenta',7:'setenta',8:'ochenta',9:'noventa'};

  function wordFor(n){
    if(n === 100) return 'cien';
    if(n < 10) return ones[n];
    if(n < 20) return teens[n - 10];
    if(n < 30) return twenties[n - 20];
    const tensDigit = Math.floor(n / 10);
    const unit = n % 10;
    if(unit === 0) return tens[tensDigit];
    return `${tens[tensDigit]} y ${ones[unit]}`;
  }

  const out = [];
  for(let n = 1; n <= 100; n++){
    const word = wordFor(n);
    out.push({
      es: word, esCanon: word, esAnswers: [word],
      nl: String(n), nlCanon: String(n), nlAnswers: [String(n)],
      part: 3
    });
  }
  return out;
}

// ---- Werkwoorden: hablar / comer / vivir, presente (part 4) ----
function buildVerbs(){
  const persons = ['yo','tú','él/ella/usted','nosotros/-as','vosotros/-as','ellos/ellas/ustedes'];
  const conj = {
    hablar: ['hablo','hablas','habla','hablamos','habláis','hablan'],
    comer:  ['como','comes','come','comemos','coméis','comen'],
    vivir:  ['vivo','vives','vive','vivimos','vivís','viven']
  };
  const out = [];
  Object.keys(conj).forEach(verb => {
    persons.forEach((p, i) => {
      const form = conj[verb][i];
      out.push({
        es: form, esCanon: form, esAnswers: [form],
        nl: `${verb} — ${p}`, nlCanon: `${verb} — ${p}`, nlAnswers: [`${verb} ${p}`],
        part: 4
      });
    });
  });
  return out;
}

function shuffle(arr){
  const a = arr.slice();
  for(let i = a.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function normalize(str){
  return str
    .normalize('NFD').replace(/[\u0300-\u036f]/g, '')
    .toLowerCase()
    .replace(/[¿?¡!.,()]/g, '')
    .replace(/\s+/g, ' ')
    .trim();
}

function stripDigits(str){
  return normalize(str).replace(/[0-9]/g, '').replace(/\s+/g, ' ').trim();
}

function getPool(wset){
  if(wset === 'everything') return WORDS.filter(w => [1,2,5,6,7,8,9,10,11].includes(w.part));
  if(wset === 'part1') return WORDS.filter(w => w.part === 1);
  if(wset === 'part2') return WORDS.filter(w => w.part === 2);
  if(wset === 'numbers') return WORDS.filter(w => w.part === 3);
  if(wset === 'verbs') return WORDS.filter(w => w.part === 4);
  if(wset === 'days') return WORDS.filter(w => w.part === 5);
  if(wset === 'subjects') return WORDS.filter(w => w.part === 6);
  if(wset === 'traits') return WORDS.filter(w => w.part === 7);
  if(wset === 'commute') return WORDS.filter(w => w.part === 8);
  if(wset === 'expr') return WORDS.filter(w => w.part === 9);
  if(wset === 'sent1') return WORDS.filter(w => w.part === 10);
  if(wset === 'sent2') return WORDS.filter(w => w.part === 11);
  return WORDS.filter(w => w.part === 1 || w.part === 2);
}

function pickDirection(item){
  if(item && item.part === 4) return 'nl-sp';
  if(item && item.part === 3) return 'nl-sp';
  if(item && item.numLenient) return Math.random() < 0.5 ? 'sp-nl' : 'nl-sp';
  if(settings.direction === 'mixed') return Math.random() < 0.5 ? 'sp-nl' : 'nl-sp';
  return settings.direction;
}

function startQuiz(list){
  order = shuffle(list).map(item => ({ item, direction: pickDirection(item) }));
  idx = 0;
  correctCount = 0;
  wrongCount = 0;
  mistakes = [];

  statWrong.textContent = '0';

  statsRow.style.display = 'flex';
  topMenuBtn.style.display = 'inline-block';
  rulesBtnTop.style.display = settings.wset === 'verbs' ? 'inline-block' : 'none';
  rulesPanel.style.display = 'none';

  if(settings.exercise === 'mc'){
    footerNote.textContent = 'Klik of gebruik 1-4, Enter voor de volgende vraag.';
  } else if(settings.exercise === 'flash'){
    footerNote.textContent = 'Tik op "Toon antwoord" en beoordeel jezelf eerlijk.';
  } else {
    footerNote.textContent = 'Enter: eerste keer controleren, nog een keer voor de volgende vraag.';
  }

  quizCard.style.display = settings.exercise === 'type' ? 'flex' : 'none';
  mcCard.style.display = settings.exercise === 'mc' ? 'block' : 'none';
  flashCard.style.display = settings.exercise === 'flash' ? 'block' : 'none';

  showQuestion();
}

    playCardIn(flashCard);
  } else {
    showTypeQuestion(item, direction);
    playCardIn(quizCard);
  }
}

function getPromptLabel(item, direction){
  if(item.part === 4) return 'Werkwoord';
  if(item.part === 3) return direction === 'sp-nl' ? 'Spaans' : 'Getal';
  return direction === 'sp-nl' ? 'Spaans' : 'Nederlands';
}
function getAnswerLabel(item, direction){
  if(item.part === 4) return 'Spaans (vervoeging):';
  if(item.part === 3) return direction === 'sp-nl' ? 'Getal:' : 'Spaans:';
  return direction === 'sp-nl' ? 'Nederlands:' : 'Spaans:';
}

function showTypeQuestion(item, direction){
  answeredCurrent = false;
  const isSpToNl = direction === 'sp-nl';
  promptLang.textContent = getPromptLabel(item, direction);
  esWordEl.textContent = isSpToNl ? item.es : item.nl;
  answerLabel.textContent = getAnswerLabel(item, direction);
  answerInput.value = '';
  answerInput.disabled = false;
  feedbackEl.textContent = '';
  feedbackEl.className = 'feedback';
  markEl.className = 'mark';
  checkBtn.disabled = false;
  nextBtn.disabled = true;
  answerInput.focus();
}

function checkAnswer(){
  if(answeredCurrent) return;
  const { item, direction } = order[idx];
  const given = normalize(answerInput.value);
  if(given.length === 0) return;

  const accepted = direction === 'sp-nl' ? item.nlAnswers : item.esAnswers;
  const correctDisplay = direction === 'sp-nl' ? item.nlCanon : item.esCanon;
  const rawGiven = answerInput.value.trim();
  let isCorrect;
  if(item.numLenient){
    isCorrect = accepted.some(ans => stripDigits(ans) === stripDigits(rawGiven)) && /\d/.test(rawGiven);
  } else {
    isCorrect = accepted.some(ans => normalize(ans) === given);
  }
  answeredCurrent = true;
  answerInput.disabled = true;
  checkBtn.disabled = true;
  nextBtn.disabled = false;

  if(isCorrect){
    correctCount++;
    statCorrect.textContent = correctCount;
    feedbackEl.textContent = 'Goed!';
    feedbackEl.className = 'feedback correct';
    markEl.textContent = '\u2713';
    markEl.className = 'mark correct show';
  } else {
    wrongCount++;
    statWrong.textContent = wrongCount;
    mistakes.push(order[idx]);
    feedbackEl.textContent = `Fout \u2014 juist antwoord: ${correctDisplay}`;
    feedbackEl.className = 'feedback wrong';
    markEl.textContent = '\u2717';
    markEl.className = 'mark wrong show';
  }
}

function nextQuestion(){
  idx++;
  if(idx >= order.length){
    showResult();
  } else {
    showQuestion();
  }
}

function skipQuestion(){
  if(answeredCurrent) return;
  wrongCount++;
  statWrong.textContent = wrongCount;
  mistakes.push(order[idx]);
  nextQuestion();
}

// ---------- multiple choice ----------
function showMcQuestion(item, direction){
  answeredCurrent = false;
  const isSpToNl = direction === 'sp-nl';
  mcPromptLang.textContent = getPromptLabel(item, direction);
  mcWordEl.textContent = isSpToNl ? item.es : item.nl;
  mcFeedback.textContent = '';
  mcFeedback.className = 'feedback';
  mcMark.className = 'mark';
  mcNextBtn.disabled = true;

  const correctText = isSpToNl ? item.nlCanon : item.esCanon;
  const correctKey = normalize(correctText);
  const others = pool.filter(w => w !== item);
  const shuffledOthers = shuffle(others);
  const distractors = [];
  for(const w of shuffledOthers){
    const candidate = isSpToNl ? w.nlCanon : w.esCanon;
    if(normalize(candidate) !== correctKey && !distractors.some(d => normalize(d) === normalize(candidate))){
      distractors.push(candidate);
    }
    if(distractors.length === 3) break;
  }
  const options = shuffle([correctText, ...distractors]);

  mcOptionsEl.innerHTML = '';
  options.forEach((opt, i) => {
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'mc-option';
    btn.textContent = `${i + 1}. ${opt}`;
    btn.addEventListener('click', () => selectMcOption(btn, opt, correctText));
    mcOptionsEl.appendChild(btn);
  });
}

function selectMcOption(btn, chosenText, correctText){
  if(answeredCurrent) return;
  answeredCurrent = true;
  const isCorrect = normalize(chosenText) === normalize(correctText);

  mcOptionsEl.querySelectorAll('.mc-option').forEach(b => {
    b.disabled = true;
    if(normalize(b.textContent.replace(/^\d+\.\s*/, '')) === normalize(correctText)){
      b.classList.add('correct');
    }
  });
  if(!isCorrect) btn.classList.add('wrong');

  mcNextBtn.disabled = false;

  if(isCorrect){
    correctCount++;
    statCorrect.textContent = correctCount;
    mcFeedback.textContent = 'Goed!';
    mcFeedback.className = 'feedback correct';
    mcMark.textContent = '\u2713';
    mcMark.className = 'mark correct show';
  } else {
    wrongCount++;
    statWrong.textContent = wrongCount;
    mistakes.push(order[idx]);
    mcFeedback.textContent = `Fout \u2014 juist antwoord: ${correctText}`;
    mcFeedback.className = 'feedback wrong';
    mcMark.textContent = '\u2717';
    mcMark.className = 'mark wrong show';
  }
}

// ---------- flashcards ----------
function showFlashQuestion(item, direction){
  answeredCurrent = false;
  const isSpToNl = direction === 'sp-nl';
  flashPromptLang.textContent = getPromptLabel(item, direction);
  flashWordEl.textContent = isSpToNl ? item.es : item.nl;
  flashAnswerEl.textContent = '';
  flashMark.className = 'mark';
  flashRevealRow.style.display = 'flex';
  gradeRow.style.display = 'none';
}

function revealAnswer(){
  const { item, direction } = order[idx];
  const isSpToNl = direction === 'sp-nl';
  flashAnswerEl.textContent = isSpToNl ? item.nl : item.es;
  flashRevealRow.style.display = 'none';
  gradeRow.style.display = 'flex';
}

function gradeSelf(isCorrect){
  if(answeredCurrent) return;
  answeredCurrent = true;
  if(isCorrect){
    correctCount++;
    statCorrect.textContent = correctCount;
    flashMark.textContent = '\u2713';
    flashMark.className = 'mark correct show';
  } else {
    wrongCount++;
    statWrong.textContent = wrongCount;
    mistakes.push(order[idx]);
    flashMark.textContent = '\u2717';
    flashMark.className = 'mark wrong show';
  }
  setTimeout(nextQuestion, 250);
}

revealBtn.addEventListener('click', revealAnswer);
gradeWrongBtn.addEventListener('click', () => gradeSelf(false));
gradeCorrectBtn.addEventListener('click', () => gradeSelf(true));

document.addEventListener('keydown', (e) => {
  if(homeCard.style.display !== 'none') return;
  if(menuCard.style.display !== 'none') return;
  if(themeCard.style.display !== 'none') return;
  if(resultCard.style.display === 'block') return;

  if(settings.exercise === 'flash'){
    if(e.key === 'Enter' || e.key === ' '){
      e.preventDefault();
      if(gradeRow.style.display === 'none'){
        revealAnswer();
      }
    }
    if(!answeredCurrent && gradeRow.style.display !== 'none'){
      if(e.key.toLowerCase() === 'g') gradeSelf(true);
      if(e.key.toLowerCase() === 'f') gradeSelf(false);
    }
    return;
  }

  if(settings.exercise === 'mc'){
    if(e.key >= '1' && e.key <= '4'){
      const i = parseInt(e.key, 10) - 1;
      const btns = mcOptionsEl.querySelectorAll('.mc-option');
      if(btns[i] && !answeredCurrent){
        btns[i].click();
      }
    }
    if(e.key === 'Enter' && answeredCurrent){
      e.preventDefault();
      nextQuestion();
    }
    return;
  }

  if(e.key !== 'Enter') return;
  e.preventDefault();
  if(!answeredCurrent){
    checkAnswer();
  } else {
    nextQuestion();
  }
});

answerForm.addEventListener('submit', (e) => e.preventDefault());
nextBtn.addEventListener('click', nextQuestion);
skipBtn.addEventListener('click', skipQuestion);
mcNextBtn.addEventListener('click', nextQuestion);

function showResult(){
  hideAllScreens();
  resultCard.style.display = 'block';
  finalScore.textContent = `${correctCount} / ${order.length}`;
  playCardIn(resultCard);

  const pct = Math.round((correctCount / order.length) * 100);
  if(pct === 100){
    finalNote.textContent = 'Alles goed. Klaar voor de toets!';
  } else if(pct >= 85){
    finalNote.textContent = 'Heel goed, nog even de foute woorden herhalen.';
  } else if(pct >= 60){
    finalNote.textContent = 'Op de goede weg \u2014 herhaal de foute woorden nog een paar keer.';
  } else {
    finalNote.textContent = 'Nog even doorzetten. Herhaal de foute woorden en probeer opnieuw.';
  }

  if(mistakes.length > 0){
    mistakeList.style.display = 'block';
    retryMistakesBtn.style.display = 'inline-block';
    mistakeItems.innerHTML = '';
    mistakes.forEach(m => {
      const li = document.createElement('li');
      li.innerHTML = `<span class="es">${m.item.es}</span><span class="nl">${m.item.nl}</span>`;
      mistakeItems.appendChild(li);
    });
  } else {
    mistakeList.style.display = 'none';
    retryMistakesBtn.style.display = 'none';
  }
}

retryAllBtn.addEventListener('click', () => startQuiz(pool));
retryMistakesBtn.addEventListener('click', () => startQuiz(mistakes.map(m => m.item)));

applyTheme(settings.theme);
showHome();
</script>
</body>
</html>
